upstream stockpulse_api {
    # "api" is the service name. Docker Compose and Kubernetes both resolve it by DNS,
    # which is why the same config works in both without changes.
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api goes to the backend. The browser only ever talks to Nginx,
    # so the API never needs a public address and CORS never becomes a problem.
    location /api/ {
        proxy_pass http://stockpulse_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Ops endpoints proxied through too, so Prometheus can scrape via the Ingress.
    location = /metrics { proxy_pass http://stockpulse_api/metrics; }
    location = /healthz { proxy_pass http://stockpulse_api/healthz; }
    location = /readyz  { proxy_pass http://stockpulse_api/readyz; }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
