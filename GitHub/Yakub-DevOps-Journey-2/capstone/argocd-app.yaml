# Register the Helm chart with Argo CD. Apply once:
#   kubectl apply -f argocd-app.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpulse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paragonadey/yaco-devops-journey.git
    targetRevision: main
    path: capstone/helm/stockpulse
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpulse
  syncPolicy:
    automated:
      prune: true        # delete resources removed from Git
      selfHeal: true     # revert manual kubectl changes - this is what makes it GitOps
    syncOptions:
      - CreateNamespace=true
