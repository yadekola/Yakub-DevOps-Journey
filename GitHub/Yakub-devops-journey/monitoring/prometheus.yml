# Lab 5 - minimal Prometheus config.
# Reload after editing:  curl -X POST http://localhost:9090/-/reload
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['10.0.1.10:9100', '10.0.11.10:9100']
        labels:
          env: 'learning'
    # If a target shows DOWN: check the security group on port 9100 FIRST.
    # It is almost always the security group, not Prometheus.
