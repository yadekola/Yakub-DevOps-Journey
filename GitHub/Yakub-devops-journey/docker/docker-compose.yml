# Lab 7 - the whole stack in one command:
#   cp .env.example .env   (then edit .env - it is gitignored)
#   docker compose up -d
#   docker compose ps      -> every service should read "healthy", not just "running"

services:
  vprodb:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}   # read from .env, never hard-coded
    volumes:
      - vprodb-data:/var/lib/mysql       # named volume = data survives `down`
    networks: [vpronet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10

  vprocache:
    image: memcached:1.6-alpine
    networks: [vpronet]

  vpromq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    networks: [vpronet]

  vproapp:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      vprodb:
        condition: service_healthy    # wait for READY, not just started
      vprocache:
        condition: service_started
      vpromq:
        condition: service_started
    networks: [vpronet]

  vproweb:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on: [vproapp]
    networks: [vpronet]

volumes:
  vprodb-data:

networks:
  vpronet:
    driver: bridge
